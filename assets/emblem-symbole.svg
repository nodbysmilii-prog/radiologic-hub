<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 52 292 260" fill="none">
  <!-- Logo, calque 1/2 : le symbole (disque, anneau, trois bras, point central), symétrique d'ordre 3 autour de (274, 215).
       Il fait un tiers de tour au survol du logo et retombe identique (styles.css, .brand-symbole).
       Même cadre que emblem.svg ; calque 2/2 (traits fixes) : emblem-traits.svg. -->
  <defs>
    <radialGradient id="g" cx="274" cy="215" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7c832"/><stop offset=".38" stop-color="#f7c832"/>
      <stop offset=".38" stop-color="#f5aa2b"/><stop offset=".62" stop-color="#f5aa2b"/>
      <stop offset=".62" stop-color="#f18d25"/><stop offset=".82" stop-color="#f18d25"/>
      <stop offset=".82" stop-color="#ea701e"/><stop offset="1" stop-color="#ea701e"/>
    </radialGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="88" y="52" width="292" height="260">
      <rect x="88" y="52" width="292" height="260" fill="#fff"/>
      <g id="cut"><rect x="266" y="215" width="16" height="80" fill="#000"/></g>
      <use href="#cut" transform="rotate(120 274 215)"/>
      <use href="#cut" transform="rotate(240 274 215)"/>
      <circle cx="274" cy="215" r="17" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#m)">
    <circle cx="274" cy="215" r="57" fill="url(#g)"/>
    <circle cx="274" cy="215" r="64" stroke="#3f3d56" stroke-width="3.5"/>
  </g>
  <g stroke="#3f3d56" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <g id="arm"><path d="M267 229V281M281 229V281"/></g>
    <use href="#arm" transform="rotate(120 274 215)"/>
    <use href="#arm" transform="rotate(240 274 215)"/>
  </g>
  <circle cx="274" cy="215" r="8" fill="#3f3d56"/>
</svg>
