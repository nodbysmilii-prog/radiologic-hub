# =====================================================================
# Espace DICOM — compléments pour les tests et le développement local
# sans projet Supabase : PostgreSQL avec la simulation de Supabase et
# les migrations du dépôt, et PostgREST (l'API REST de Supabase).
# Utilisé par npm run test:dicom (tests/integration.js) :
#   docker compose -f docker-compose.yml -f docker-compose.test.yml …
# Données de test synthétiques uniquement (outils/generer-dicom-test.js).
# =====================================================================
services:
  supabase-db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${SIMULATION_MOT_DE_PASSE:?à définir}
      SIMULATION_MOT_DE_PASSE: ${SIMULATION_MOT_DE_PASSE}
    volumes:
      - ../tests/sql/supabase-simule.sql:/simulation/supabase-simule.sql:ro
      - ../supabase/migrations:/simulation/migrations:ro
      - ./tests/supabase-simule/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks: [simulation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"select 1 from pg_roles where rolname = 'authenticator'\" | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  postgrest:
    image: postgrest/postgrest:v16.3
    depends_on:
      supabase-db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${SIMULATION_MOT_DE_PASSE}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?à définir}
      PGRST_SERVER_PORT: "3000"
    networks: [simulation]

  dicom-api:
    depends_on:
      postgrest: { condition: service_started }
    environment:
      SUPABASE_REST_URL: http://postgrest:3000
    volumes:
      - ./outils:/app/outils:ro
      - ${DONNEES_TEST_DIR:-./donnees-test}:/donnees-test:ro
    networks: [interne, sortie, simulation]

networks:
  # Simulation de Supabase : pas d'accès à Internet
  simulation:
    internal: true
