# En-têtes de sécurité de l'Espace DICOM (inclus dans chaque bloc qui
# ajoute ses propres en-têtes : Nginx n'hérite pas des add_header).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Aucune adresse transmise aux sites tiers (les liens de partage ne fuient pas)
add_header Referrer-Policy "no-referrer" always;
# La visionneuse ne s'affiche que dans le site RadiologicHub (DICOM_SITE_ORIGINES)
add_header Content-Security-Policy $dicom_csp always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
