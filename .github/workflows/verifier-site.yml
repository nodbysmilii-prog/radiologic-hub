# RadiologicHub — vérifie chaque proposition de modification AVANT fusion : tests, schéma Supabase,
# construction du site public (liste blanche, aucun fichier interne ni secret, dépendances complètes).
# Automatique sur chaque Pull Request et sur la branche principale ; aucun secret utilisé.
# La mise en ligne elle-même est faite par Cloudflare Pages (commande « npm run publication »),
# qui garde la version précédente en ligne si la construction échoue.
name: Vérifier le site

on:
  pull_request:
  push:
    branches: [claude/radiologichub-website-ss89g9]
  workflow_dispatch:

# Lecture seule : ce workflow ne publie rien et ne reçoit aucun secret.
permissions:
  contents: read

concurrency:
  group: verifier-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Tests et construction du site public
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests (règles de calcul, modules, publication)
        run: npm test
      - name: Construction du site public (dist/) et vérification
        run: npm run publication
      - name: Droits d'accès Supabase (PostgreSQL local, données fictives)
        run: npm run test:sql
