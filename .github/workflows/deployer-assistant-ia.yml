# Déploie la fonction Supabase « cr-ia » (assistant IA de rédaction) à la demande.
# Secrets du dépôt nécessaires : SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
# Guide : assistant-ia/INSTALLATION.md, étape 5.
name: Déployer l'assistant IA (Supabase)

on:
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier que la copie serveur est à jour
        run: node --test tests/assistant-ia.test.js
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer cr-ia
        run: supabase functions deploy cr-ia --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
